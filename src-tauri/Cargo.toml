[package]
name = "pulse-metric-studio"
version = "0.1.0"
description = "Desktop metric authoring for Tableau Pulse"
authors = ["ahillspace"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["dynamic-acl", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = "4.1.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
