[package]
name = "pulse-metric-studio"
version = "0.1.1"
description = "Desktop metric authoring for Tableau Pulse"
authors = ["ahillspace"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["dynamic-acl", "tray-icon", "image-png"] }
tauri-plugin-opener = "=2.5.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
hmac = "0.12"
sha2 = "0.10"
rfd = { version = "0.15", default-features = false }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = "4.1.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
