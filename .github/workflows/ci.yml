name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:architecture
      - name: Unit and isolated server integration tests
        run: npm test

  native:
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Assert build architecture
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: node -e "require('node:assert/strict').equal(process.arch, process.env.BUILD_ARCH)"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - name: Native unit and transport tests
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = '{"bundle":{"resources":[]}}'
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          exit $LASTEXITCODE
      - name: Build isolated desktop installers
        run: node scripts/build-native.mjs --output native-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-metric-studio-${{ matrix.os }}-${{ matrix.arch }}
          path: native-artifacts/
          if-no-files-found: error
